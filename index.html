<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Alpaka Kasse</title>
<meta name="theme-color" content="#0E0E0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alpaka Kasse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0E0E0E; --panel:#181715; --panel2:#22201d; --line:#3a352c;
  --gold:#C9A24D; --gold2:#e3c37a; --off:#F7F3EC; --muted:#a39b8b;
  --red:#ff5a4e; --green:#5fd38d;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--black);color:var(--off);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px}
body{min-height:100vh;touch-action:manipulation;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* Header */
header{position:sticky;top:0;z-index:20;background:rgba(14,14,14,.96);backdrop-filter:blur(8px);
  padding:calc(var(--safe-t) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand .name{letter-spacing:.32em;font-size:12px;font-weight:500;color:var(--off)}
.brand .sub{letter-spacing:.2em;font-size:10px;color:var(--gold)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.market-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--gold);border-radius:10px;
  color:var(--off);font-size:14px;max-width:70%;overflow:hidden}
.market-btn b{color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undo-btn{padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--muted);white-space:nowrap}
.undo-btn:active{background:var(--panel2)}

main{padding:14px 12px calc(230px + var(--safe-b))}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:28px;margin:4px 4px 12px;color:var(--off)}
h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:22px 4px 10px;font-weight:600}

.banner{background:#3a2a10;border:1px solid var(--gold);color:var(--off);padding:12px 14px;border-radius:12px;margin-bottom:12px;font-size:14px;line-height:1.4}
.banner button{color:var(--gold2);text-decoration:underline;padding:0}

/* Tiles */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;background:var(--panel);border:2px solid var(--c);border-radius:16px;padding:12px 6px 10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;-webkit-user-select:none;
  transition:transform .08s ease, background .15s;min-width:0}
.tile:active{transform:scale(.95)}
.tile.flash{background:var(--c)}
.tile.flash .tname,.tile.flash .tprice,.tile.flash .tstock{color:#111}
.ticon{width:72px;height:72px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#111;position:relative}
.ticon svg{width:50px;height:50px}
svg .d{fill:none;stroke:var(--c);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
svg .o{fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.tvar{position:absolute;bottom:-4px;right:-10px;background:var(--off);color:#111;font-size:10px;font-weight:800;border-radius:8px;padding:2px 6px;border:2px solid var(--panel)}
.tname{font-weight:700;font-size:14px;line-height:1.15;text-align:center;min-height:2.3em;display:flex;align-items:center;justify-content:center;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.tprice{color:var(--gold2);font-weight:600;font-size:15px}
.tprice.missing{color:var(--red)}
.tstock{font-size:11px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tstock.low{color:var(--red);font-weight:700}
.badge{position:absolute;top:-8px;right:-8px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--gold);color:#111;
  font-weight:800;display:grid;place-items:center;font-size:16px;border:2px solid var(--black)}
.tile.out{opacity:.55}

/* Variant picker */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.vbtn{position:relative;background:var(--panel2);border:2px solid var(--c);border-radius:16px;padding:16px 4px 12px;
  display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.vbtn:active{background:var(--c)}
.vbtn:active .vn,.vbtn:active .vp,.vbtn:active .vs{color:#111}
.vbtn .vn{font-size:30px;font-weight:800;color:var(--off);line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtn .vn.long{font-size:18px;line-height:1.3}
.vbtn .vp{font-size:13px;color:var(--gold2);font-weight:600}
.vbtn .vs{font-size:12px;color:var(--muted)}
.vbtn .vs.low{color:var(--red);font-weight:700}
.vbtn.out{opacity:.5}
.vhint{font-size:14px;color:var(--muted);margin:0 4px}

/* Cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-b));z-index:30;padding:0 10px 8px}
.cartinner{background:var(--panel2);border:1px solid var(--gold);border-radius:16px;padding:10px;display:flex;gap:8px;align-items:center;box-shadow:0 -6px 24px rgba(0,0,0,.6)}
.cartsum{flex:1;text-align:left;padding:4px 6px;min-width:0}
.cartsum .n{font-size:12px;color:var(--muted)}
.cartsum .t{font-size:22px;font-weight:700;color:var(--off)}
.cartsum .t s{font-size:14px;color:var(--muted);font-weight:400;margin-left:6px}
.paytoggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.paytoggle button{padding:10px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.paytoggle button.on{background:var(--off);color:#111}
.sellbtn{background:var(--gold);color:#111;font-weight:800;padding:14px 14px;border-radius:12px;font-size:16px}
.sellbtn:active{background:var(--gold2)}

/* Nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0b0b0a;border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--safe-b)}
nav button{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--gold2)}

/* Lists, cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.kpi .l{font-size:11px;color:var(--muted);letter-spacing:.06em}
.kpi .v{font-size:17px;font-weight:700;margin-top:3px}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.sub{padding:6px 4px 6px 54px;border-bottom:1px dashed #2c2822}
.row.sub + .row:not(.sub){border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .small,.small{font-size:12px;color:var(--muted)}
.chip{width:40px;height:40px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#111;flex:none}
.chip svg{width:30px;height:30px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);font-size:22px;font-weight:600;color:var(--off)}
.stepper button:active{background:var(--panel2)}
.stepper .q{min-width:34px;text-align:center;font-weight:700;font-size:17px}
.btn{display:block;width:100%;padding:15px;border-radius:12px;border:1px solid var(--gold);color:var(--gold2);font-weight:600;font-size:16px;margin-top:10px;text-align:center}
.btn.solid{background:var(--gold);color:#111;border-color:var(--gold)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:active{opacity:.8}
.mini{padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.mini.gold{border-color:var(--gold);color:var(--gold2)}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--muted);margin-left:4px}
.tag.karte{color:#7cc4ff}
.tag.ueberweisung{color:var(--green)}
.tag.note{color:var(--off);background:#2e2a22}
/* V3: Warenkorb zweizeilig */
.cartinner{flex-direction:column;align-items:stretch;gap:8px}
.cartrow{display:flex;gap:8px;align-items:center}
.cartrow .paytoggle{flex:1}
.cartrow .paytoggle button{flex:1;padding:11px 4px}
.notebtn{padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted);max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notebtn.has{border-color:var(--gold);color:var(--gold2)}
/* V3: Verkaufsort */
.placefix{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.place{padding:18px 10px;border:2px solid var(--gold);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--off)}
.place svg{width:34px;height:34px;color:var(--gold2)}
.place.on,.marketlist button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.place.on svg{color:#111}
/* V3: Übersicht */
.seg{display:flex;border:1px solid var(--gold);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;padding:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--gold);color:#111}
.kpi.big{grid-column:1/-1}
.kpi.big .v{font-size:24px;color:var(--gold2)}
.bar{height:8px;background:var(--panel2);border-radius:4px;margin-top:7px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--gold);border-radius:4px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:15px;line-height:1.5}
select.dayselect{width:100%;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--gold);color:var(--off);font-size:16px;margin-bottom:12px}
.lowtext{color:var(--red);font-weight:700}
.note{color:var(--muted);margin:12px 4px;line-height:1.5;font-size:13px}

/* Modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border-top:2px solid var(--gold);border-radius:20px 20px 0 0;width:100%;max-width:560px;
  max-height:92vh;overflow:auto;padding:18px 16px calc(20px + var(--safe-b))}
.sheet h2{margin-top:0}
label.f{display:block;font-size:12px;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;text-transform:uppercase}
input.in{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--black);font-size:17px;color:var(--off);min-width:0}
input.in.sm{padding:10px 8px;font-size:16px;border-radius:10px}
input.in:focus{outline:none;border-color:var(--gold)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.iconpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.iconpick button{--c:var(--panel);aspect-ratio:1;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;color:var(--off)}
.iconpick button svg{width:34px;height:34px}
.iconpick button.on{--c:var(--panel2);border-color:var(--gold);background:var(--panel2);color:var(--gold2)}
.colorpick{display:flex;flex-wrap:wrap;gap:10px}
.colorpick button{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid transparent}
.colorpick button.on{border-color:var(--off);box-shadow:0 0 0 2px var(--black) inset}
.marketlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.marketlist button{padding:12px 14px;border:1px solid var(--gold);border-radius:12px;color:var(--off);font-size:15px}
.closex{float:right;font-size:28px;color:var(--muted);line-height:1;padding:0 4px}
.varbox{background:var(--black);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:6px}
.vhead,.vrow{display:grid;grid-template-columns:1.25fr 1fr 1fr 1.15fr 38px;gap:6px;align-items:center}
.vhead{margin-bottom:6px}
.vhead span{font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.vrow{margin-bottom:6px}
.vrow button{height:42px;border:1px solid var(--line);border-radius:10px;color:var(--red);font-size:16px}
.qadd{display:flex;gap:8px;margin-top:8px}
.qadd input{flex:1}

/* Toast */
.toast{position:fixed;left:12px;right:12px;bottom:calc(235px + var(--safe-b));z-index:200;background:var(--off);color:#111;border-radius:14px;
  padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);
  transform:translateY(20px);opacity:0;transition:all .2s;pointer-events:none}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast.warn{background:var(--red);color:#fff}
.toast span{flex:1}
.toast button{font-weight:800;color:#8a6414;padding:4px 6px}
.toast.warn button{color:#fff;text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="34" height="22" viewBox="0 0 34 22" fill="none" stroke="#C9A24D" stroke-width="1.4"><path d="M1 21 12 6l5 6 4-5 12 14"/><path d="M12 6l2-3 1.5 2.5" stroke="#8d8a83"/></svg>
    <div><div class="name">GLOCKNER ALPAKAS</div><div class="sub">MARKTKASSE</div></div>
  </div>
  <div class="hrow">
    <button class="market-btn" data-act="market"><span>Ort:</span><b id="mname">–</b></button>
    <button class="undo-btn" data-act="undo" id="undoBtn">↶ Storno</button>
  </div>
</header>

<main id="view"></main>
<div id="cartbar"></div>

<nav>
  <button data-nav="sell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Verkauf</button>
  <button data-nav="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Übersicht</button>
  <button data-nav="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></svg>Produkte</button>
  <button data-nav="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Mehr</button>
</nav>

<div id="modal"></div>
<div class="toast" id="toast"><span id="toastText"></span><button id="toastBtn"></button></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<input type="file" id="importFile" accept=".csv,text/csv,text/plain,text/comma-separated-values" hidden>

<script>
'use strict';
/* ---------- Icons ---------- */
const I = (p) => `<svg viewBox="0 0 48 48" fill="currentColor" stroke="none">${p}</svg>`;
const D = 'class="d"', O = 'class="o"';
const SOLE = 'M12 2c5 0 8 4.5 8 11 0 5-2 8-2 13 0 8-2.6 14-6 14s-6-5.5-6-12.5C6 21.5 4 18.5 4 13 4 6.5 7 2 12 2z';
const ICONS = {
  seife:   {l:'Seife',    s:I(`<rect x="3" y="22" width="34" height="19" rx="6"/><path ${D} d="M10 31h14"/><circle cx="37" cy="15" r="7"/><circle cx="27" cy="11" r="4"/><circle cx="41" cy="5" r="3.2"/><circle cx="35" cy="13" r="2" style="fill:var(--c)"/>`)},
  einlage: {l:'Einlagen', s:I(`<g transform="translate(1 3)"><path d="${SOLE}"/><path ${D} stroke-dasharray="2.6 2.4" transform="translate(3 5.5) scale(.75)" d="${SOLE}"/></g><g transform="translate(47 3) scale(-1 1)"><path d="${SOLE}"/><path ${D} stroke-dasharray="2.6 2.4" transform="translate(3 5.5) scale(.75)" d="${SOLE}"/></g>`)},
  decke:   {l:'Decke',    s:I(`<rect x="3" y="29" width="42" height="13" rx="6.5" style="stroke:var(--c);stroke-width:2.5"/><rect x="5" y="17" width="38" height="13" rx="6.5" style="stroke:var(--c);stroke-width:2.5"/><rect x="7" y="5" width="34" height="13" rx="6.5" style="stroke:var(--c);stroke-width:2.5"/><path ${D} d="M29 7v9M33 7v9M29 19v9M33 19v9M29 31v9M33 31v9"/>`)},
  kappe:   {l:'Kappe',    s:I(`<path d="M4 31C4 18 12 10 23 10s19 8 19 19v2z"/><path d="M20 29h21c5 0 6.5 2.5 6.5 4.2 0 1.6-1.2 2.8-3 2.8H20z"/><circle cx="23" cy="8.5" r="2.6"/><path ${D} d="M23 11c-4 5-5 11-4.6 18M23 11c5 4 7.5 10 8 18"/>`)},
  muetze:  {l:'Mütze',    s:I(`<circle cx="24" cy="8" r="6.5"/><path d="M8 33C8 21 15 13 24 13s16 8 16 20z"/><rect x="5" y="31" width="38" height="12" rx="3.5"/><path ${D} d="M11 34v6M17 34v6M23 34v6M29 34v6M35 34v6M17 28c1-5 3-8 7-10M31 28c-1-5-3-8-7-10"/>`)},
  socken:  {l:'Socken',   s:I(`<path d="M15 3h16v22l8.5 8.5c3.5 3.5 1.2 10.5-4.5 10.5h-9c-3 0-5.4-1.2-7.4-3.2L15 37.2z"/><path ${D} d="M15 8.5h16M15 13h16M29 40c-1.5-2-2-4.5-1-7"/>`)},
  schal:   {l:'Schal',    s:I(`<path d="M6 9c6-6 30-6 36 0v8c-6-5-30-5-36 0z"/><path d="M12 14h11v24H12z"/><path d="M25 14l11 1.5-3.4 24-10.6-1.5z"/><path ${D} d="M12 22h11M12 30h11M25 22.5l10 1.3M24 30.5l9.8 1.3"/><path ${O} d="M14 40v5M17.5 40v5M21 40v5M25 41l-.6 5M28.5 41.5l-.6 5M32 42l-.6 5"/>`)},
  hand:    {l:'Handschuh',s:I(`<path d="M13 36V19c0-7 4.5-12 10.5-12S34 12 34 19v5l3.5-3.6c2.6-2.6 7.2 0 5.3 3.4L34 36z"/><rect x="12" y="34" width="23" height="11" rx="2.5"/><path ${D} d="M17 37v5M22 37v5M27 37v5M32 37v5M27 21v9"/>`)},
  wolle:   {l:'Wolle',    s:I(`<circle cx="22" cy="22" r="18"/><path ${D} d="M8 14c10 2 20 10 23 24M13 7c10 5 18 14 21 27M5 25c9 1 16 6 19 14M28 5c-6 6-10 15-10 33"/><path ${O} d="M35 35c4 3 7 4 9 3"/>`)},
  matte:   {l:'Matte',    s:I(`<rect x="3" y="32" width="30" height="7" rx="2"/><circle cx="32" cy="24" r="15"/><circle ${D} cx="32" cy="24" r="10"/><circle ${D} cx="32" cy="24" r="5"/>`)},
  kissen:  {l:'Kissen',   s:I(`<path d="M5 9c4-3 34-3 38 0 3 5 3 25 0 30-4 3-34 3-38 0-3-5-3-25 0-30z"/><path ${D} stroke-dasharray="3 3" d="M10 13c6-1.5 22-1.5 28 0 1.5 6 1.5 16 0 22-6 1.5-22 1.5-28 0-1.5-6-1.5-16 0-22z"/><circle cx="24" cy="24" r="2.6" style="fill:var(--c)"/>`)},
  tier:    {l:'Alpaka',   s:I(`<rect x="27" y="10" width="8" height="21" rx="4"/><rect x="27" y="7" width="15" height="9" rx="4.5"/><path d="M28 9l1-7 3.5 6M32.5 8l2-6.5 2.5 6.5z"/><circle cx="10" cy="22" r="4"/><rect x="7" y="20" width="29" height="15" rx="7.5"/><rect x="10" y="32" width="4" height="13" rx="2"/><rect x="16" y="32" width="4" height="13" rx="2"/><rect x="24" y="32" width="4" height="13" rx="2"/><rect x="30" y="32" width="4" height="13" rx="2"/><circle cx="35" cy="11" r="1.6" style="fill:var(--c)"/>`)},
  geschenk:{l:'Geschenk', s:I(`<rect x="6" y="20" width="36" height="24" rx="2.5"/><rect x="3" y="13" width="42" height="9" rx="2"/><path ${D} d="M24 13v31" style="stroke-width:5"/><path ${O} d="M24 13c-3-7-12-8-11-3 .8 3 7 3 11 3zM24 13c3-7 12-8 11-3-.8 3-7 3-11 3z"/>`)},
  sonst:   {l:'Sonstiges',s:I(`<path d="M4 24 22 6h20v20L24 44z"/><circle cx="33" cy="15" r="4" style="fill:var(--c)"/>`)},
};
const COLORS = ['#F2B33D','#3FA7D6','#FF6B4A','#6DD47E','#C08BF0','#FF8FB8','#2EC4B6','#F4F1E8','#FF9F1C','#9DB4FF','#E9E36A','#D08A5A'];
function guessIcon(name){
  const n=name.toLowerCase();
  const map=[['seife','seife'],['einlage','einlage'],['sohle','einlage'],['decke','decke'],['kappe','kappe'],['cap','kappe'],
    ['mütze','muetze'],['muetze','muetze'],['haube','muetze'],['beanie','muetze'],['socke','socken'],['strumpf','socken'],['schal','schal'],['loop','schal'],
    ['handschuh','hand'],['fäustl','hand'],['wolle','wolle'],['garn','wolle'],['matte','matte'],['kissen','kissen'],['plüsch','tier'],['figur','tier'],['gutschein','geschenk'],['geschenk','geschenk']];
  for(const [k,v] of map) if(n.includes(k)) return v;
  return 'sonst';
}

/* ---------- State ---------- */
const KEY = 'ga-kasse-v1';   // gleicher Speicher wie Version 1, damit keine Daten verloren gehen
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function defaults(){
  const mk=(id,name,icon,color,variants)=>({id,name,price:0,stock:0,low:3,icon,color,variants:variants||[]});
  const sizes=['37','39','41','43','44'].map((n,i)=>({id:'v'+(i+1),name:n,stock:0,price:null}));
  return { v:2, nextId:100,
    products:[ mk('p1','Alpaka-Seife','seife',COLORS[0]), mk('p2','Schuheinlagen','einlage',COLORS[1],sizes),
               mk('p3','Bettdecke','decke',COLORS[2]), mk('p4','Kappe','kappe',COLORS[3]), mk('p5','Wollmütze','muetze',COLORS[4]) ],
    sales:[], markets:[], session:{date:'',market:''} };
}
function migrate(s){
  for(const p of s.products){ if(!Array.isArray(p.variants)) p.variants=[]; if(p.low==null) p.low=3; }
  s.v=2; return s;
}
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.products)) return migrate(s); }catch(e){} return defaults(); }
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Speichern fehlgeschlagen! Bitte Backup machen.', null, true); } }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

const PAY={bar:'Bar',karte:'Karte',ueberweisung:'Überweisung'};
const PAYSHORT={bar:'Bar',karte:'Karte',ueberweisung:'Überw.'};
const payLabel = p => PAY[p]||p;
const FIXED_PLACES=['Hofladen','Online-Shop'];
const defaultPay = () => S.session.market==='Online-Shop' ? 'ueberweisung' : 'bar';
let view='sell', cart={}, override=null, pay=defaultPay(), note='', dayPick=null, ovMode='day', monthPick=null;
const prod = id => S.products.find(p=>p.id===id);
const vars = p => (p && Array.isArray(p.variants)) ? p.variants : [];
const hasVar = p => vars(p).length>0;
const findVar = (p,vid) => vars(p).find(v=>v.id===vid);
const vprice = (p,v) => (v && v.price!=null) ? v.price : p.price;
const stockOf = (p,v) => v ? v.stock : (hasVar(p) ? vars(p).reduce((a,x)=>a+x.stock,0) : p.stock);
const isLowP = p => hasVar(p) ? vars(p).some(v=>v.stock<=p.low) : p.stock<=p.low;
const priceMissing = p => hasVar(p) ? vars(p).some(v=>!vprice(p,v)) : !p.price;
const ckey = (pid,vid) => vid ? pid+'|'+vid : pid;
const splitKey = k => { const [pid,vid]=String(k).split('|'); return {pid,vid:vid||null}; };
const itemLabel = i => i.vname ? `${i.name} · ${i.vname}` : i.name;
const eur = n => new Intl.NumberFormat('de-AT',{style:'currency',currency:'EUR'}).format(n||0);
const num = v => { const n=parseNum(v); return n==null||!isFinite(n)?0:n; };
function parseNum(v){
  let s=String(v??'').replace(/[€\s ']/g,'');
  if(s==='') return null;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s); return isFinite(n)?n:NaN;
}
const r2 = n => Math.round(n*100)/100;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = k => (ICONS[k]||ICONS.sonst).s;
const fmtDate = d => { const [y,m,dd]=d.split('-'); const w=['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(+y,m-1,+dd).getDay()]; return `${w}, ${+dd}.${+m}.${y}`; };
const fmtTime = ts => new Date(ts).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
const decStr = n => String(r2(n).toFixed(2)).replace('.',',');
function soldCounts(){ const c={}; for(const s of S.sales) for(const i of s.items){ c[i.pid]=(c[i.pid]||0)+i.qty; if(i.vid){ const k=ckey(i.pid,i.vid); c[k]=(c[k]||0)+i.qty; } } return c; }
function cartItems(){
  const out=[];
  for(const [k,qty] of Object.entries(cart)){ if(qty<=0) continue;
    const {pid,vid}=splitKey(k); const p=prod(pid); if(!p) continue;
    const v=vid?findVar(p,vid):null; if(vid && !v) continue;
    out.push({key:k,pid,vid,qty,p,v,price:vprice(p,v),label:v?`${p.name} · ${v.name}`:p.name});
  }
  return out;
}
const cartSum = () => cartItems().reduce((a,x)=>a+x.qty*x.price,0);
const cartCount = () => cartItems().reduce((a,x)=>a+x.qty,0);
const cartCountFor = pid => cartItems().filter(x=>x.pid===pid).reduce((a,x)=>a+x.qty,0);
function sortVariants(list){
  if(list.length && list.every(v=>/^\d+([.,]\d+)?$/.test(v.name.trim()))) list.sort((a,b)=>num(a.name)-num(b.name));
  return list;
}

/* ---------- Toast ---------- */
let tt;
function toast(text, action, warn){
  const t=document.getElementById('toast'), b=document.getElementById('toastBtn');
  document.getElementById('toastText').textContent=text;
  t.classList.toggle('warn',!!warn);
  if(action){ b.textContent=action.label; b.style.display=''; b.onclick=()=>{ t.classList.remove('show'); action.fn(); }; }
  else { b.style.display='none'; b.onclick=null; }
  t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'), action?5000:3200);
}

/* ---------- Rendering ---------- */
function render(){
  document.getElementById('mname').textContent = S.session.date===today() && S.session.market ? S.session.market : 'bitte wählen';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.nav===view));
  document.getElementById('undoBtn').style.visibility = S.sales.some(s=>s.date===today()) ? 'visible':'hidden';
  const v=document.getElementById('view');
  if(view==='sell') v.innerHTML=renderSell();
  if(view==='day') v.innerHTML= ovMode==='month' ? renderMonth() : renderDay();
  if(view==='stock') v.innerHTML=renderStock();
  if(view==='more') v.innerHTML=renderMore();
  renderCartBar();
}

function tilePrice(p){
  if(priceMissing(p)) return `<span class="tprice missing">Preis?</span>`;
  if(hasVar(p)){ const ps=vars(p).map(v=>vprice(p,v)); const mn=Math.min(...ps), mx=Math.max(...ps);
    return `<span class="tprice">${mn===mx?eur(mn):'ab '+eur(mn)}</span>`; }
  return `<span class="tprice">${eur(p.price)}</span>`;
}
function tileStock(p){
  const total=stockOf(p);
  if(hasVar(p)){
    const low=vars(p).filter(v=>v.stock<=p.low);
    if(total<=0) return `<span class="tstock low">Ausverkauft</span>`;
    if(low.length) return `<span class="tstock low">Knapp: ${low.map(v=>esc(v.name)).join(', ')}</span>`;
    return `<span class="tstock">Bestand ${total}</span>`;
  }
  if(p.stock<=0) return `<span class="tstock low">Ausverkauft</span>`;
  if(p.stock<=p.low) return `<span class="tstock low">Nur noch ${p.stock}</span>`;
  return `<span class="tstock">Bestand ${p.stock}</span>`;
}
function renderSell(){
  const counts=soldCounts();
  const list=[...S.products].sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0) || a.name.localeCompare(b.name,'de'));
  let h='';
  if(S.products.some(priceMissing)) h+=`<div class="banner">Bei manchen Produkten fehlt noch der Preis. <button data-nav="stock">Jetzt unter Produkte eintragen</button></div>`;
  if(!list.length) return h+`<div class="empty">Noch keine Produkte.<br><button class="btn" data-act="newprod">Produkt anlegen</button></div>`;
  h+='<div class="grid">';
  for(const p of list){
    const q=cartCountFor(p.id);
    h+=`<button class="tile${stockOf(p)<=0?' out':''}" style="--c:${p.color}" data-add="${p.id}">
      ${q?`<span class="badge">${q}</span>`:''}
      <span class="ticon">${icon(p.icon)}${hasVar(p)?`<span class="tvar">${vars(p).length} Gr.</span>`:''}</span>
      <span class="tname">${esc(p.name)}</span>
      ${tilePrice(p)}
      ${tileStock(p)}
    </button>`;
  }
  return h+'</div>';
}

function renderCartBar(){
  const el=document.getElementById('cartbar');
  if(view!=='sell' || !cartCount()){ el.innerHTML=''; return; }
  const sum=cartSum(), tot=override!=null?override:sum;
  el.innerHTML=`<div class="cartbar"><div class="cartinner">
    <div class="cartrow">
      <button class="cartsum" data-act="cart"><div class="n">${cartCount()} Stk · antippen zum Ändern</div>
        <div class="t">${eur(tot)}${override!=null && Math.abs(override-sum)>0.004?`<s>${eur(sum)}</s>`:''}</div></button>
      <button class="sellbtn" data-act="sell">Verkauft</button>
    </div>
    <div class="cartrow">
      <div class="paytoggle">${Object.keys(PAY).map(k=>`<button class="${pay===k?'on':''}" data-pay="${k}">${PAYSHORT[k]}</button>`).join('')}</div>
      <button class="notebtn${note?' has':''}" data-act="note">${note?esc(note):'✎ Notiz'}</button>
    </div>
  </div></div>`;
}

function dayStats(sales){
  const r={total:0,bar:0,karte:0,ueberweisung:0,count:sales.length,items:0,disc:0};
  for(const s of sales){ r.total+=s.total; r[s.pay]=(r[s.pay]||0)+s.total; r.disc+=s.sum-s.total; r.items+=s.items.reduce((a,i)=>a+i.qty,0); }
  return r;
}
function perProduct(sales){
  const per={};
  for(const s of sales) for(const i of s.items){ const k=ckey(i.pid,i.vid);
    per[k]=per[k]||{name:i.name,vname:i.vname||'',qty:0,val:0,pid:i.pid}; per[k].qty+=i.qty; per[k].val+=i.qty*i.price; }
  return Object.values(per).sort((a,b)=>a.name.localeCompare(b.name,'de') || num(a.vname)-num(b.vname) || a.vname.localeCompare(b.vname,'de'));
}
function renderDay(){
  const days=[...new Set(S.sales.map(s=>s.date))].sort().reverse();
  if(!days.includes(today())) days.unshift(today());
  if(!dayPick || !days.includes(dayPick)) dayPick=days[0];
  const sales=S.sales.filter(s=>s.date===dayPick);
  let h=ovHead()+`<select class="dayselect" data-act="daypick">${days.map(d=>`<option value="${d}"${d===dayPick?' selected':''}>${fmtDate(d)}${d===today()?' (heute)':''}</option>`).join('')}</select>`;
  if(!sales.length) return h+`<div class="empty">An diesem Tag noch keine Verkäufe.</div>`;
  const markets=[...new Set(sales.map(placeOf))];
  h+=kpiCard(dayStats(sales))+`<button class="btn solid" data-dexp="">Tagesbericht exportieren (Excel)</button>`;
  if(markets.length>1){
    h+='<h3>Pro Verkaufsort</h3><div class="card">';
    for(const m of markets){ const st=dayStats(sales.filter(s=>placeOf(s)===m));
      h+=`<div class="row"><div class="grow"><b>${esc(m)}</b><div class="small">${eur(st.total)} · ${payLine(st)}</div></div><button class="mini gold" data-dexp="${esc(m)}">Export</button></div>`; }
    h+='</div>';
  } else h+=`<div class="note">Verkaufsort: ${esc(markets[0])}</div>`;
  h+='<h3>Verkaufte Produkte</h3><div class="card">';
  for(const x of perProduct(sales).sort((a,b)=>b.qty-a.qty)){ const p=prod(x.pid);
    h+=`<div class="row"><span class="chip" style="--c:${p?p.color:'#888'}">${icon(p?p.icon:'sonst')}</span><div class="grow"><b>${esc(x.name)}${x.vname?` · ${esc(x.vname)}`:''}</b><div class="small">${eur(x.val)} zum Listenpreis</div></div><b>${x.qty} Stk</b></div>`; }
  h+='</div><h3>Alle Verkäufe</h3><div class="card">';
  for(const s of [...sales].reverse()){
    h+=`<div class="row"><div class="grow"><b>${fmtTime(s.ts)}</b> <span class="tag ${s.pay}">${payLabel(s.pay)}</span>${s.total<s.sum-0.004?`<span class="tag">Rabatt ${eur(s.sum-s.total)}</span>`:''}
      <div class="small">${s.items.map(i=>`${i.qty}× ${esc(itemLabel(i))}`).join(', ')}</div>${s.note?`<div class="small" style="color:var(--off)">Notiz: ${esc(s.note)}</div>`:''}</div>
      <b>${eur(s.total)}</b><button class="mini" data-storno="${s.id}">✕</button></div>`;
  }
  return h+'</div>';
}

const placeOf = s => s.market||'Ohne Ort';
const payLine = st => Object.keys(PAY).filter(k=>st[k]>0.004).map(k=>`${PAYSHORT[k]} ${eur(st[k])}`).join(' · ') || '–';
const MONTHS=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtMonth = m => { const [y,mm]=m.split('-'); return `${MONTHS[+mm-1]} ${y}`; };
function ovHead(){
  return `<h2>Übersicht</h2><div class="seg"><button data-ov="day" class="${ovMode==='day'?'on':''}">Tag</button><button data-ov="month" class="${ovMode==='month'?'on':''}">Monat</button></div>`;
}
function kpiCard(st){
  return `<div class="card"><div class="kpis">
      <div class="kpi big"><div class="l">UMSATZ</div><div class="v">${eur(st.total)}</div></div>
      <div class="kpi"><div class="l">BAR</div><div class="v">${eur(st.bar)}</div></div>
      <div class="kpi"><div class="l">KARTE</div><div class="v">${eur(st.karte)}</div></div>
      <div class="kpi"><div class="l">ÜBERW.</div><div class="v">${eur(st.ueberweisung)}</div></div></div>
      <div class="row small" style="border:0;padding-bottom:0">${st.count} ${st.count===1?'Verkauf':'Verkäufe'} · ${st.items} Stück${st.disc>0.004?` · Rabatt gesamt ${eur(st.disc)}`:''}</div></div>`;
}
function renderMonth(){
  const cur=today().slice(0,7);
  const months=[...new Set(S.sales.map(s=>s.date.slice(0,7)))].sort().reverse();
  if(!months.includes(cur)) months.unshift(cur);
  if(!monthPick || !months.includes(monthPick)) monthPick=months[0];
  const sales=S.sales.filter(s=>s.date.slice(0,7)===monthPick);
  let h=ovHead()+`<select class="dayselect" data-act="monthpick">${months.map(m=>`<option value="${m}"${m===monthPick?' selected':''}>${fmtMonth(m)}${m===cur?' (aktuell)':''}</option>`).join('')}</select>`;
  if(!sales.length) return h+`<div class="empty">In diesem Monat noch keine Verkäufe.</div>`;
  h+=kpiCard(dayStats(sales))+`<button class="btn solid" data-mexp="1">Monatsbericht exportieren (Excel)</button>`;
  const places=[...new Set(sales.map(placeOf))].map(m=>({m,st:dayStats(sales.filter(s=>placeOf(s)===m))})).sort((a,b)=>b.st.total-a.st.total);
  const max=Math.max(...places.map(x=>x.st.total),0.01);
  h+='<h3>Pro Verkaufsort</h3><div class="card">';
  for(const {m,st} of places) h+=`<div class="row"><div class="grow"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(m)}</b><b>${eur(st.total)}</b></div>
      <div class="small">${st.count} ${st.count===1?'Verkauf':'Verkäufe'} · ${payLine(st)}</div><div class="bar"><span style="width:${Math.max(2,st.total/max*100)}%"></span></div></div></div>`;
  h+='</div><h3>Meistverkauft</h3><div class="card">';
  for(const x of perProduct(sales).sort((a,b)=>b.qty-a.qty).slice(0,10)){ const p=prod(x.pid);
    h+=`<div class="row"><span class="chip" style="--c:${p?p.color:'#888'}">${icon(p?p.icon:'sonst')}</span><div class="grow"><b>${esc(x.name)}${x.vname?` · ${esc(x.vname)}`:''}</b><div class="small">${eur(x.val)} zum Listenpreis</div></div><b>${x.qty} Stk</b></div>`; }
  h+='</div><h3>Pro Tag</h3><div class="card">';
  for(const d of [...new Set(sales.map(s=>s.date))].sort().reverse()){ const ds=sales.filter(s=>s.date===d);
    h+=`<button class="row" style="width:100%;text-align:left" data-gotoday="${d}"><div class="grow"><b>${fmtDate(d)}</b><div class="small">${[...new Set(ds.map(placeOf))].map(esc).join(', ')}</div></div><b>${eur(dayStats(ds).total)}</b><span class="small">›</span></button>`; }
  return h+'</div>';
}

function renderStock(){
  let h=`<h2>Produkte & Lager</h2>`;
  const low=[];
  for(const p of S.products){ if(hasVar(p)) vars(p).forEach(v=>{ if(v.stock<=p.low) low.push(`${esc(p.name)} ${esc(v.name)} (${v.stock})`); }); else if(p.stock<=p.low) low.push(`${esc(p.name)} (${p.stock})`); }
  if(low.length) h+=`<div class="banner">Fast ausverkauft: ${low.join(', ')}</div>`;
  h+='<div class="card">';
  for(const p of [...S.products].sort((a,b)=>a.name.localeCompare(b.name,'de'))){
    const sub = priceMissing(p)?'<span class="lowtext">Preis fehlt</span>':(hasVar(p)?`${eur(p.price)} · ${vars(p).length} Größen · Gesamt ${stockOf(p)}`:eur(p.price));
    h+=`<div class="row"><span class="chip" style="--c:${p.color}">${icon(p.icon)}</span>
      <button class="grow" style="text-align:left" data-edit="${p.id}"><b>${esc(p.name)}</b><div class="small">${sub} · bearbeiten ›</div></button>
      ${hasVar(p)?'':`<div class="stepper"><button data-stk="${p.id}" data-d="-1">−</button><span class="q${p.stock<=p.low?' lowtext':''}">${p.stock}</span><button data-stk="${p.id}" data-d="1">+</button></div>`}</div>`;
    for(const v of vars(p)){
      h+=`<div class="row sub"><div class="grow"><b>${esc(v.name)}</b>${v.price!=null?`<div class="small">eigener Preis ${eur(v.price)}</div>`:''}</div>
        <div class="stepper"><button data-stk="${p.id}|${v.id}" data-d="-1">−</button><span class="q${v.stock<=p.low?' lowtext':''}">${v.stock}</span><button data-stk="${p.id}|${v.id}" data-d="1">+</button></div></div>`;
    }
  }
  h+=`</div><button class="btn solid" data-act="newprod">+ Neues Produkt</button>
     <div class="note">Ware nachbuchen: mit + einzeln erhöhen, oder Produkt antippen und bei „Zugang“ die neue Stückzahl eintragen. Viele Änderungen auf einmal gehen bequemer über Excel (unter „Mehr“).</div>`;
  return h;
}

function renderMore(){
  return `<h2>Mehr</h2>
  <button class="btn" data-act="market">Verkaufsort wechseln</button>
  <h3>Lagerliste (Excel)</h3>
  <button class="btn" data-act="csvStock">Lagerliste exportieren</button>
  <button class="btn" data-act="import">Lagerliste importieren</button>
  <div class="note">So geht’s: Lagerliste exportieren, in Excel Preise und Bestände ändern oder neue Zeilen anhängen, als <b>CSV</b> speichern und hier wieder importieren. Neue Zeilen ohne ID werden als neue Produkte bzw. Größen angelegt. Produkte, die in der Datei fehlen, bleiben unverändert.</div>
  <h3>Verkäufe (Excel)</h3>
  <button class="btn" data-act="csvSales">Alle Verkäufe exportieren</button>
  <div class="note">Berichte für einen Tag, einen Verkaufsort oder einen ganzen Monat bekommst du unter „Übersicht“.</div>
  <h3>Datensicherung</h3>

/* ---------- Actions ---------- */
function addToCart(id, el){
  const p=prod(id); if(!p) return;
  if(hasVar(p)){ variantModal(id); return; }
  if(!p.price){ toast('Für '+p.name+' fehlt noch der Preis',null,true); return; }
  cart[id]=(cart[id]||0)+1; override=null;
  if(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),140); }
  render();
}
function addVariant(key){
  const {pid,vid}=splitKey(key); const p=prod(pid), v=findVar(p,vid); if(!p||!v) return;
  if(!vprice(p,v)){ toast(`Für ${p.name} ${v.name} fehlt noch der Preis`,null,true); return; }
  cart[key]=(cart[key]||0)+1; override=null;
  closeModal(); render();
  const tile=document.querySelector(`[data-add="${pid}"]`);
  if(tile){ tile.classList.add('flash'); setTimeout(()=>tile.classList.remove('flash'),160); }
}
function doSell(){
  const its=cartItems(); if(!its.length) return;
  if(!(S.session.date===today() && S.session.market)){ marketModal(true); return; }
  const items=its.map(x=>({pid:x.pid,vid:x.vid||undefined,name:x.p.name,vname:x.v?x.v.name:undefined,qty:x.qty,price:x.price}));
  const sum=items.reduce((a,i)=>a+i.qty*i.price,0);
  const total=override!=null?override:sum;
  const sale={id:S.nextId++,ts:Date.now(),date:today(),market:S.session.market,pay,items,sum:r2(sum),total:r2(total)};
  if(note.trim()) sale.note=note.trim();
  S.sales.push(sale);
  for(const x of its){ if(x.v) x.v.stock-=x.qty; else x.p.stock-=x.qty; }
  cart={}; override=null; note=''; pay=defaultPay(); save(); render();
  const lows=its.filter(x=>(x.v?x.v.stock:x.p.stock)<=x.p.low).map(x=>`${x.label} noch ${x.v?x.v.stock:x.p.stock}`);
  if(lows.length) toast('Achtung: '+lows.join(', '), {label:'Storno',fn:()=>storno(sale.id,true)}, true);
  else toast('Verkauft · '+eur(sale.total), {label:'Rückgängig',fn:()=>storno(sale.id,true)});
}
function storno(id, silent){
  const s=S.sales.find(x=>x.id===id); if(!s) return;
  if(!silent && !confirm(`Verkauf von ${fmtTime(s.ts)} über ${eur(s.total)} stornieren?`)) return;
  for(const i of s.items){ const p=prod(i.pid); if(!p) continue;
    if(i.vid){ const v=findVar(p,i.vid); if(v) v.stock+=i.qty; } else p.stock+=i.qty; }
  S.sales=S.sales.filter(x=>x.id!==id); save(); render(); toast('Verkauf storniert');
}
function undoLast(){
  const t=S.sales.filter(s=>s.date===today()); if(!t.length) return;
  const s=t[t.length-1];
  if(confirm(`Letzten Verkauf stornieren?\n${fmtTime(s.ts)}: ${s.items.map(i=>i.qty+'× '+itemLabel(i)).join(', ')} – ${eur(s.total)}`)) storno(s.id,true);
}
function saveProduct(id){
  const sh=document.querySelector('.sheet');
  const name=document.getElementById('pName').value.trim(); if(!name){ toast('Bitte einen Namen eingeben',null,true); return; }
  const old=id?prod(id):null;
  const variants=[]; const seen=new Set();
  for(const row of document.querySelectorAll('#vRows .vrow')){
    const vn=row.querySelector('.vname').value.trim(); if(!vn || seen.has(vn.toLowerCase())) continue; seen.add(vn.toLowerCase());
    const pv=row.querySelector('.vprice').value.trim();
    variants.push({ id:row.dataset.vid || ('v'+(S.nextId++)), name:vn,
      stock:Math.round(num(row.querySelector('.vstock').value))+Math.round(num(row.querySelector('.vadd').value)),
      price: pv==='' ? null : r2(Math.max(0,num(pv))) });
  }
  sortVariants(variants);
  const data={name,price:r2(num(document.getElementById('pPrice').value)),
    stock: variants.length ? (old?old.stock:0) : Math.round(num(document.getElementById('pStock').value))+Math.round(num(document.getElementById('pAdd').value)),
    low:Math.max(0,Math.round(num(document.getElementById('pLow').value))),icon:sh.dataset.icon,color:sh.dataset.color,variants};
  if(old) Object.assign(old,data); else S.products.push({id:'p'+(S.nextId++),...data});
  // Warenkorb-Einträge entfernen, deren Größe gelöscht wurde
  for(const k of Object.keys(cart)){ const {pid,vid}=splitKey(k); const p=prod(pid); if(!p || (vid && !findVar(p,vid)) || (!vid && hasVar(p))) delete cart[k]; }
  save(); closeModal(); render(); toast(name+' gespeichert');
}

/* ---------- CSV helpers ---------- */
async function shareFile(name, content, type){
  const blob=new Blob([content],{type});
  try{ const file=new File([blob],name,{type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; } }
  catch(e){ if(e && e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
}
const csvCell=v=>{ v=String(v??''); return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
const toCSV = rows => '﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
const dec = n => decStr(n||0);
const deDate = d => d.split('-').reverse().join('.');
const fileSafe = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* ---------- Import ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const cnt=ch=>first.split(ch).length-1;
  const d = cnt('\t')>cnt(';') && cnt('\t')>cnt(',') ? '\t' : (cnt(';')>=cnt(',') ? ';' : ',');
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; continue; }
    if(ch==='"') q=true;
    else if(ch===d){ row.push(f); f=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=ch;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function decodeFile(buf){
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); }
}
function importStock(text){
  const rows=parseCSV(text);
  const hi=rows.findIndex(r=>r.some(c=>c.trim().toLowerCase()==='produkt'));
  if(hi<0){ toast('Keine Spalte „Produkt“ gefunden. Bitte die exportierte Lagerliste verwenden.',null,true); return; }
  const head=rows[hi].map(h=>h.trim().toLowerCase());
  const col=(...names)=>head.findIndex(h=>names.some(n=>h===n||h.startsWith(n)));
  const C={id:col('id'),name:col('produkt'),vname:col('größe','groesse','variante'),price:head.findIndex(h=>h==='preis'||h==='preis €'||h==='preis (€)'),
    vprice:col('eigener preis'),stock:col('bestand'),low:col('warnen')};
  const P=JSON.parse(JSON.stringify(S.products)); let nextId=S.nextId;
  const st={upd:0,newP:0,newV:0,errors:[]};
  const get=(r,k)=>C[k]>=0 ? (r[C[k]]??'').trim() : undefined;
  rows.slice(hi+1).forEach((r,ri)=>{
    const line=hi+ri+2;
    const id=get(r,'id')||'', name=get(r,'name')||'', vname=get(r,'vname')||'';
    if(!id && !name) return;
    let p=null, v=null;
    if(id){ const k=splitKey(id); p=P.find(x=>x.id===k.pid)||null; if(p && k.vid) v=(p.variants||[]).find(x=>x.id===k.vid)||null; }
    if(!p && name) p=P.find(x=>x.name.toLowerCase()===name.toLowerCase())||null;
    let isNew=false;
    if(!p){ p={id:'p'+(nextId++),name,price:0,stock:0,low:3,icon:guessIcon(name),color:COLORS[P.length%COLORS.length],variants:[]}; P.push(p); st.newP++; isNew=true; }
    else if(name && id && p.name!==name) p.name=name;
    if(!Array.isArray(p.variants)) p.variants=[];
    if(vname && !v){ v=p.variants.find(x=>x.name.toLowerCase()===vname.toLowerCase())||null;
      if(!v){ v={id:'v'+(nextId++),name:vname,stock:0,price:null}; p.variants.push(v); st.newV++; isNew=true; } }
    else if(v && vname && v.name!==vname) v.name=vname;
    const pr=get(r,'price'); if(pr){ const n=parseNum(pr); if(isNaN(n)) st.errors.push(`Zeile ${line}: Preis „${pr}“`); else p.price=r2(n); }
    const lo=get(r,'low'); if(lo){ const n=parseNum(lo); if(isNaN(n)) st.errors.push(`Zeile ${line}: Warnen ab „${lo}“`); else p.low=Math.max(0,Math.round(n)); }
    const sk=get(r,'stock'); if(sk){ const n=parseNum(sk); if(isNaN(n)) st.errors.push(`Zeile ${line}: Bestand „${sk}“`); else { if(v) v.stock=Math.round(n); else p.stock=Math.round(n); } }
    if(v && C.vprice>=0){ const vp=get(r,'vprice'); if(vp===''){ v.price=null; } else { const n=parseNum(vp); if(isNaN(n)) st.errors.push(`Zeile ${line}: Eigener Preis „${vp}“`); else v.price=r2(n); } }
    if(!isNew) st.upd++;
  });
  P.forEach(p=>sortVariants(p.variants));
  let msg=`Lagerliste importieren?\n\n${st.upd} Zeilen aktualisiert\n${st.newP} neue Produkte\n${st.newV} neue Größen`;
  if(st.errors.length) msg+=`\n\nNicht verstanden (bleibt unverändert):\n${st.errors.slice(0,6).join('\n')}${st.errors.length>6?'\n…':''}`;
  if(!confirm(msg)) return;
  S.products=P; S.nextId=nextId; save(); render(); toast('Lagerliste importiert');
}

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act],[data-nav],[data-add],[data-addv],[data-pay],[data-stk],[data-edit],[data-storno],[data-cq],[data-mk],[data-ic],[data-col],[data-dexp],[data-ov],[data-gotoday],[data-mexp]');
  if(!t) return;
  const d=t.dataset;
  if(d.nav){ view=d.nav; closeModal(); window.scrollTo(0,0); render(); return; }
  if(d.add){ addToCart(d.add,t); return; }
  if(d.addv){ addVariant(d.addv); return; }
  if(d.pay){ pay=d.pay; renderCartBar(); return; }
  if(d.stk){ const {pid,vid}=splitKey(d.stk); const p=prod(pid); if(!p) return; const v=vid?findVar(p,vid):null; if(v) v.stock+=+d.d; else p.stock+=+d.d; save(); render(); return; }
  if(d.edit){ prodModal(d.edit); return; }
  if(d.storno){ storno(+d.storno); return; }
  if(d.cq){ cart[d.cq]=Math.max(0,(cart[d.cq]||0)+(+d.d)); if(!cart[d.cq]) delete cart[d.cq]; override=null; render(); if(cartCount()) cartModal(); else closeModal(); return; }
  if(d.mk){ setMarket(d.mk); return; }
  if(d.ov){ ovMode=d.ov; render(); return; }
  if(d.gotoday){ ovMode='day'; dayPick=d.gotoday; window.scrollTo(0,0); render(); return; }
  if(d.mexp){ csvMonth(monthPick); return; }
  if(d.dexp!==undefined){ csvDay(dayPick, d.dexp||null); return; }
  if(d.ic){ document.querySelectorAll('[data-ic]').forEach(b=>b.classList.toggle('on',b===t)); document.querySelector('.sheet').dataset.icon=d.ic; return; }
  if(d.col){ document.querySelectorAll('[data-col]').forEach(b=>b.classList.toggle('on',b===t)); document.querySelector('.sheet').dataset.color=d.col; return; }
  switch(d.act){
    case 'closebg': if(e.target===t) closeModal(); break;
    case 'close': closeModal(); break;
    case 'market': marketModal(false); break;
    case 'mkSave': setMarket(document.getElementById('mkIn').value); break;
    case 'undo': undoLast(); break;
    case 'cart': cartModal(); break;
    case 'note': cartModal(); setTimeout(()=>{ const n=document.getElementById('noteIn'); if(n) n.focus(); },50); break;
    case 'sell': doSell(); break;
    case 'ovSave': { note=document.getElementById('noteIn').value.trim(); const v=document.getElementById('ovIn').value.trim(); override=v===''?null:Math.max(0,r2(num(v))); closeModal(); render(); break; }
    case 'clearCart': cart={}; override=null; note=''; closeModal(); render(); break;
    case 'newprod': prodModal(null); break;
    case 'vQuick': quickAddVariants(); break;
    case 'vDel': t.closest('.vrow').remove(); syncVarUI(); break;
    case 'pSave': saveProduct(d.id||null); break;
    case 'pDel': if(confirm('Produkt wirklich löschen? Bisherige Verkäufe bleiben erhalten.')){ S.products=S.products.filter(p=>p.id!==d.id); for(const k of Object.keys(cart)) if(splitKey(k).pid===d.id) delete cart[k]; save(); closeModal(); render(); } break;
    case 'csvSales': csvSales(); break;
    case 'csvStock': csvStock(); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'backup': shareFile(`AlpakaKasse_Backup_${today()}.json`, JSON.stringify(S), 'application/json'); break;
    case 'restore': document.getElementById('restoreFile').click(); break;
    case 'wipeSales': if(confirm('Wirklich ALLE Verkäufe löschen? Mach vorher ein Backup!') && confirm('Ganz sicher? Das kann nicht rückgängig gemacht werden.')){ S.sales=[]; save(); render(); toast('Alle Verkäufe gelöscht'); } break;
  }
});
document.addEventListener('input', e=>{ if(e.target.id==='pPrice') syncVarUI(); if(e.target.id==='noteIn'){ note=e.target.value.trim(); renderCartBar(); } });
document.addEventListener('change', e=>{
  if(e.target.matches('[data-act="daypick"]')){ dayPick=e.target.value; render(); }
  if(e.target.matches('[data-act="monthpick"]')){ monthPick=e.target.value; render(); }
  if(e.target.id==='restoreFile' && e.target.files[0]){
    const r=new FileReader(); r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!Array.isArray(s.products)||!Array.isArray(s.sales)) throw 0;
      if(confirm(`Backup laden? (${s.sales.length} Verkäufe, ${s.products.length} Produkte) Die aktuellen Daten werden ersetzt.`)){ S=migrate(s); cart={}; save(); render(); toast('Backup geladen'); } }
      catch(err){ toast('Das ist keine gültige Backup-Datei',null,true); } }; r.readAsText(e.target.files[0]); e.target.value='';
  }
  if(e.target.id==='importFile' && e.target.files[0]){
    const r=new FileReader(); r.onload=()=>{ try{ importStock(decodeFile(r.result)); }catch(err){ toast('Datei konnte nicht gelesen werden',null,true); } };
    r.readAsArrayBuffer(e.target.files[0]); e.target.value='';
  }
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='mkIn') setMarket(e.target.value);
  if(e.target.id==='vQuick'){ e.preventDefault(); quickAddVariants(); }
});

/* ---------- Start ---------- */
save(); render();
if(S.session.date!==today()) marketModal(true);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.session.date!==today() && !document.querySelector('.modal')) marketModal(true); });
if('serviceWorker' in navigator && location.protocol==='https:'){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  // Neue Version geladen: einmal neu starten, aber nie mitten in einem Verkauf
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(hadController && !cartCount() && !document.getElementById('pName') && !(document.getElementById('mkIn')||{}).value) location.reload();
  });
}
</script>
